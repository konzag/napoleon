name: Tests

# Tests on every PR and on every push to staging and main, plus a secret scan (GAME-STANDARD, fleet conventions):
# actions pinned by SHA, read-only token, superseded runs cancelled, gitleaks pinned and checksum-verified.
on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # the coverage ratchet compares with the parent commit on a push

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # One runner for every tests/*.mjs: `ℹ tests N` summary, and a file that throws fails the job too.
      - name: Node tests
        run: node --test tests/*.mjs

      - name: Coverage floor not lowered
        run: bash tools/coverage-floor-check.sh

      - name: Python syntax check
        run: python3 -m py_compile common/terminal.py jedi-game/jedi.py diablo-game/diablo.py

      - name: Python tests (stdlib unittest)
        run: python3 -m unittest discover -s tests -v

  # Playwright in Chromium (tests/ui, TEST-ONLY dev dependencies): smoke under the hub CSP + axe.
  ui:
    runs-on: ubuntu-latest   # public repo: GitHub-hosted only
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: tests/ui
        run: npm ci && npx playwright install --with-deps chromium

      - name: Test count >= floor
        run: bash tools/test-count-check.sh

      - name: Playwright tests
        working-directory: tests/ui
        run: npx playwright test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest   # public repo: GitHub-hosted only, never the homelab runner
    timeout-minutes: 10
    permissions:   # read-only token; whole history scanned (fetch-depth 0)
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks && rm -f gitleaks "$f"
      - name: Gate - fail on any finding
        run: gitleaks detect --source=. --redact --no-banner
